name: Test

# iOS or watchOS app whose Xcode project is generated by XcodeGen (project.yml, no committed .xcodeproj).
# - the project is generated before building;
# - the simulator is picked at run time (newest runtime of the app's platform), so runner image
#   updates don't break the destination;
# - the newest stable Xcode is selected, the runner default may be older than the deployment target;
# - no code signing: CODE_SIGNING_ALLOWED=NO (works for free Apple ID / Personal Team apps);
# - SwiftLint job, with a baseline freezing pre-existing violations.
#
# Runs on every push (all branches). PRs opened by auto_pr.yml use GITHUB_TOKEN,
# which does not trigger `pull_request` workflows — the push run's status shows on the PR instead.
# Keep the name "Test": release.yml listens to it by name.
on:
  push:
    branches: [ "**" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Xcode Build & Test
    # Use the image of the Xcode major you develop with: the code may rely on its SDK
    # (macos-26 only ships Xcode 26.x). xcode-27 is a "preview" image label.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # __SIM_OS__: platform of the app target, `iOS` or `watchOS`.
      # __SIM_DEVICE__: simulator name prefix, `iPhone` (iOS) or `Apple Watch` (watchOS).
      - name: Pick simulator
        env:
          SIM_OS: __SIM_OS__
          SIM_DEVICE: __SIM_DEVICE__
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          marker, prefix = "." + os.environ["SIM_OS"] + "-", os.environ["SIM_DEVICE"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split(marker)[1])]
          runtimes = sorted((r for r in devices if marker in r), key=version, reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith(prefix)))
          ')"
          echo "DESTINATION=platform=$SIM_OS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$udid"

      # __ACTION__: `test` when the scheme has test targets (project.yml > scheme > testTargets),
      # otherwise `build` (xcodebuild test fails on a scheme without tests).
      - name: Build & Test
        run: |
          xcodebuild __ACTION__ -quiet \
            -project "__PROJECT__" \
            -scheme "__SCHEME__" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v5

      # Pre-existing violations are frozen in .swiftlint-baseline.json: only new ones
      # (warnings included, --strict) fail the job.
      - name: SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json --reporter github-actions-logging
