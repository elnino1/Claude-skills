name: Test

# Runs on every push (all branches). PRs opened by auto_pr.yml use GITHUB_TOKEN,
# which does not trigger `pull_request` workflows — the push run's status shows on the PR instead.
on:
  push:
    branches: [ "**" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Run Pytest
        run: pytest tests/
